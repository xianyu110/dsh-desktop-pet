name: 发版

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验语义化版本标签
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "标签 $RELEASE_TAG 不是有效的语义化版本" >&2
            exit 1
          fi

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: 安装依赖
        run: npm ci

      - name: 同步版本号
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/sync-version.mjs "${RELEASE_TAG#v}"

      - name: 运行测试
        run: npm test

      - name: 构建 Linux 包（deb + AppImage）
        run: npm run build

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    # Linux 上交叉编译 Windows（cargo-xwin 提供 MSVC 链接器），不占用 windows 容器
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验语义化版本标签
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "标签 $RELEASE_TAG 不是有效的语义化版本" >&2
            exit 1
          fi

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 配置 Rust（含 Windows MSVC 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装 cargo-xwin（Windows 交叉链接器）
        run: cargo install cargo-xwin --locked

      - name: 安装依赖
        run: npm ci

      - name: 同步版本号
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/sync-version.mjs "${RELEASE_TAG#v}"

      - name: 运行测试
        run: npm test

      - name: 交叉编译 Windows 包（NSIS + MSI）
        run: npm run build -- --target x86_64-pc-windows-msvc

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
