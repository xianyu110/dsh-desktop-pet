name: 发布 Windows 版本

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验语义化版本标签
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "标签 $tag 不是有效的语义化版本"
          }

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 同步版本号
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version ($env:RELEASE_TAG -replace '^v', '') --no-git-tag-version --allow-same-version

      - name: 运行测试
        run: npm test

      - name: 构建 Windows 安装包和便携版
        run: npm run dist:win

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.exe
