<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大肥鱼</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="pet" class="pet" data-state="sleep" aria-label="DSH 桌面宠物">
    <section id="pulse" class="pulse" aria-live="polite">
      <span id="connection" class="connection">正在连接</span>
      <strong id="status">正在等待 DSH</strong>
      <span id="detail" class="detail">请启动 DSH Web 服务</span>
      <span id="note" class="note" hidden></span>
    </section>
    <div id="sprite" class="sprite" role="img" aria-label="鲸鱼娘"></div>
    <nav id="actions" class="actions" aria-label="宠物操作">
      <button type="button" data-action="quit" title="退出">×</button>
    </nav>
    <div id="bubble" class="bubble" hidden></div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
